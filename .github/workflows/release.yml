name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create GitHub releases

jobs:
  # ── Build & Test ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  # ── Publish artifacts ─────────────────────────────────────────
  publish:
    name: Publish (${{ matrix.rid }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-x64
            label: linux-x64
          - rid: win-x64
            label: win-x64
          - rid: osx-x64
            label: osx-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          dotnet publish src/Mail2Go.Web/Mail2Go.Web.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishReadyToRun=true \
            -o publish/${{ matrix.rid }}

      - name: Zip artifact
        run: |
          cd publish
          zip -r ../mail2go-${{ github.ref_name }}-${{ matrix.label }}.zip ${{ matrix.rid }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mail2go-${{ matrix.label }}
          path: mail2go-${{ github.ref_name }}-${{ matrix.label }}.zip
          retention-days: 1

  # ── Create GitHub Release ─────────────────────────────────────
  release:
    name: Create Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mail2Go ${{ github.ref_name }}
          body: |
            ## Mail2Go ${{ github.ref_name }}

            A lightweight self-hosted mail server built with ASP.NET Core 10, featuring:

            ### ✨ Highlights
            - **Embedded SMTP server** (SmtpServer 11.x) — receives and stores inbound emails
            - **ASP.NET Core MVC admin dashboard** — manage domains, mailboxes, and messages
            - **SQLite storage via EF Core 10** — zero-config, single-file database
            - **ASP.NET Core Identity** — role-based access control (Admin / User)
            - **Clean Architecture** — Domain → Application → Infrastructure → Web
            - **Multi-language client samples** — .NET (SmtpClient & MailKit), Python, Node.js

            ### 📦 Downloads
            | Platform | File |
            |----------|------|
            | Linux x64 | `mail2go-${{ github.ref_name }}-linux-x64.zip` |
            | Windows x64 | `mail2go-${{ github.ref_name }}-win-x64.zip` |
            | macOS x64 | `mail2go-${{ github.ref_name }}-osx-x64.zip` |

            Each archive is a **self-contained single-file** executable — no .NET runtime required on the target machine.

            ### 🚀 Quick Start
            ```bash
            # Linux / macOS
            unzip mail2go-${{ github.ref_name }}-linux-x64.zip
            chmod +x Mail2Go.Web
            ./Mail2Go.Web
            # Open http://localhost:5050 — default admin: admin@mail2go.local / pass123
            ```

            ### ⚠️ Breaking Changes
            None — first public release.

            ### 🔄 What's Changed
          append_body: true
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*.zip
